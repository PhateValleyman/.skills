# /etc/nginx/conf.d/tgbot.conf   (TLS: certbot --nginx -d bot.example.com)
server {
    listen 443 ssl http2;
    server_name bot.example.com;
    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    # Avoid recording the webhook path, query strings or sensitive request metadata.
    access_log off;

    # Random path; register as https://bot.example.com/tg-8f3a91c7d2e45b60/ in setWebhook (+ secret_token)
    location /tg-8f3a91c7d2e45b60/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }
    location / { return 404; }
}
